apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-mesh-nginx
  labels:
    app.kubernetes.io/name: aura-mesh
    app.kubernetes.io/part-of: andrusdiaz
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(?:wasm|task)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ~* \.mjs$ {
            types { application/javascript mjs; }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
