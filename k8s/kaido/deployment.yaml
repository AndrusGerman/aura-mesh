apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-mesh
  labels:
    app.kubernetes.io/name: aura-mesh
    app.kubernetes.io/part-of: andrusdiaz
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aura-mesh
  template:
    metadata:
      labels:
        app: aura-mesh
        app.kubernetes.io/name: aura-mesh
        app.kubernetes.io/part-of: andrusdiaz
    spec:
      serviceAccountName: aura-mesh
      imagePullSecrets:
        - name: artifact-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: aura-mesh
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: aura-mesh-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

